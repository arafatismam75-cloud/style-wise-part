<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Wise Part - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121316;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .dashboard-wrapper {
            width: 100%;
            max-width: 400px;
            background-color: #1a1b1f;
            border: 1px solid #2a2b30;
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .brand-logo {
            width: 24px;
            height: 24px;
            fill: #4d8aea;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 700;
            color: #4d8aea;
            letter-spacing: -0.5px;
        }
        /* প্রোফাইল ইমেজ সেকশন */
        .profile-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
        }
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4d8aea;
            background-color: #2a2b30;
        }
        .upload-label {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #4d8aea;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid #1a1b1f;
            transition: background-color 0.2s;
        }
        .upload-label:hover {
            background-color: #3b75d4;
        }
        .upload-label svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }
        #fileInput {
            display: none;
        }
        .user-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .user-email {
            font-size: 14px;
            color: #9e9ea4;
            margin-bottom: 32px;
        }
        #message {
            font-size: 14px;
            margin-bottom: 16px;
            min-height: 20px;
        }
        .logout-btn {
            width: 100%;
            padding: 14px;
            border-radius: 28px;
            border: 1px solid #2a2b30;
            background-color: transparent;
            color: #ff6b6b;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background-color: #ff6b6b1a;
            border-color: #ff6b6b;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Brand Header -->
        <div class="brand-header">
            <svg class="brand-logo" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            </svg>
            <span class="brand-name">STYLE WISE PART</span>
        </div>

        <!-- Profile Picture Upload Area -->
        <div class="profile-container">
            <!-- ডিফল্ট অবতার ইমেজ (যদি প্রোফাইল পিক না থাকে) -->
            <img src="https://flaticon.com" alt="Profile Picture" class="profile-pic" id="profilePic">
            <label for="fileInput" class="upload-label">
                <svg viewBox="0 0 24 24">
                    <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5 5 5 0 0 0 5 5 5 5 0 0 0 5-5 5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3z"/>
                </svg>
            </label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- User Info -->
        <div class="user-name" id="userName">অপেক্ষা করুন...</div>
        <div class="user-email" id="userEmail">loading...</div>

        <!-- Status Message -->
        <div id="message"></div>

        <!-- Logout Button -->
        <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>

    <!-- JavaScript Files -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
